kind: Added
body: |-
  nvml-mock: a KubeVirt VM requesting `nvidia.com/gpu` now sees its allocated mock GPU in passthrough mode by declaring a `hostDisk` bundle volume, with no hook sidecar, while libvirt and QEMU no longer load the mock shims. See [KubeVirt launchers](docs/components/nri-plugin.md#kubevirt-launchers).
